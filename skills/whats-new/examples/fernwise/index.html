<script>
// Fernwise app update. A fictional company made for omnigami's examples.
// KEEP the release grid, rising words, cards, camera, count-up and ending.
// ADAPT the brand, fields, captured states, touch actions and sound cues.
// REPLACE the reference's desktop features with the working phone app's features.
// Every UI pixel comes from assets/screens/ and assets/full/, captured by the two phone plans.
(() => {
  const { clamp, lerp, spring, loadFont, loadImage, roundRect, capRatio, motion: m } = window.kit;
  const FPS = 60, BPM = 120, BEAT = 60 / BPM, BAR = 4 * BEAT, F = BEAT / 6; // F: a step, the choreography's unit (a sixth of a beat)
  const at = (bar, beat = 0) => +(bar * BAR + beat * BEAT).toFixed(4); // a time on the beat grid
  const SHAPES = { '9:16': [1080, 1920], '16:9': [1920, 1080], '1:1': [1440, 1440] };
  let W = 1920, H = 1080, U = 10.8, shape = '16:9', tall = false, wide = true; // U: 1% of the frame's short side

  const canvas = document.getElementById('c');
  const g = canvas.getContext('2d', { willReadFrequently: true });

  // ---------- ADAPT: the product's colours ----------
  // Two grounds that alternate (style.md): a light one and a dark one, both from the brand. The
  // dark ground sits a shade under the product's own page colour so the captured UI reads as a card.
  const LIGHT = '#F6F1E7', DARK = '#28452A';
  const ON = { light: { name: '#28452A', line: '#706C60', tag: '#706C60' }, dark: { name: '#F6F1E7', line: '#CDD9BD', tag: '#CDD9BD' } };
  const UI_INK = '#F6F1E7', UI_LINE = '#9CC57A', ACCENT = '#9CC57A';
  const SANS = (w) => (s) => `${w} ${s}px "Nunito"`;
  const MONO = SANS;
  const DISPLAY = (w) => (s) => `480 ${s}px "Fraunces"`;

  // ---------- ADAPT: the words, as named fields ----------
  const DEFAULTS = {
    open: "Plant care. What's new.",
    tag1: '', name1: 'Light check.', line1: 'Find Dot a kinder spot.',
    tag2: '', name2: 'Rescue guides.', line2: 'Three small steps. A reminder for later.',
    tag3: '', name3: 'Watered today.', line3: 'One tap per plant. Everyone gets a drink.',
    stat: '3', stat1: 'plants watered.', stat2: 'Every thirsty plant, taken care of.', statSource: 'Today.',
    product: 'Fernwise', promise: 'Keep the little ones alive.', get: 'Update Fernwise',
  };
  const FIELDS = [
    { id: 'open', type: 'text', label: 'Open line', maxLength: 32, help: 'What the product is, and that this is what is new.' },
    { id: 'tag1', type: 'text', label: 'Feature 1, version', maxLength: 8, help: 'Leave a version empty to hide it.' },
    { id: 'name1', type: 'text', label: 'Feature 1, name', maxLength: 32, help: 'One to five words, with a full stop.' },
    { id: 'line1', type: 'text', label: 'Feature 1, line', maxLength: 56 },
    { id: 'tag2', type: 'text', label: 'Feature 2, version', maxLength: 8 },
    { id: 'name2', type: 'text', label: 'Feature 2, name', maxLength: 32 },
    { id: 'line2', type: 'text', label: 'Feature 2, line', maxLength: 56 },
    { id: 'tag3', type: 'text', label: 'Feature 3, version', maxLength: 8 },
    { id: 'name3', type: 'text', label: 'Feature 3, name', maxLength: 32 },
    { id: 'line3', type: 'text', label: 'Feature 3, line', maxLength: 56 },
    { id: 'stat', type: 'text', label: 'Stat', maxLength: 8, help: 'A number from the product; it counts up from 0.' },
    { id: 'stat1', type: 'text', label: 'Stat, line 1', maxLength: 44 },
    { id: 'stat2', type: 'text', label: 'Stat, line 2', maxLength: 44 },
    { id: 'statSource', type: 'text', label: 'Proof context', maxLength: 40, help: 'Sources are recorded in STORY.md; keep this line useful to the viewer.' },
    { id: 'product', type: 'text', label: 'Name and version', maxLength: 20 },
    { id: 'promise', type: 'text', label: 'Promise', maxLength: 40 },
    { id: 'get', type: 'text', label: 'How to get it', maxLength: 32 },
  ];
  let V = DEFAULTS; // set from seek's arguments on every frame

  // ---------- KEEP: assets ----------
  // capture sets, each made by one plan: the desktop window (1440 × 900), and the app's own narrower
  // layout (a 1080 × 1080 window) that square and tall use where it lets the camera get closer
  const SETS = ['screens','full','rings'];
  const A = { sets: {}, img: {}, brand: {}, plants: {} };
  const margin = () => W * 0.07, column = () => W * 0.86;
  const cap = (name, set = 'screens') => { const c = A.sets[set].captures[name]; return { img: A.img[`${set}/${c.file}`], rect: c.rect, scale: c.scale }; };
  const R = (state, set = 'screens') => A.sets[set].rects[state];
  const pad = ([x, y, w, h], px, py = px) => [x - px, y - py, w + 2 * px, h + 2 * py];

  // ---------- KEEP: type. Words rise from behind a mask at their baseline ----------
  const steps = (t, t0) => (t - t0) / F;
  const out3 = m.out, out5 = m.out;
  const moveAt = (t, from, to) => out5((t - from) / (to - from));
  const cameraAt = (t, from, to) => m.inOut((t - from) / (to - from));
  function setText(c, font, size, tracking = 0) { c.font = font(size); c.letterSpacing = `${tracking * size}px`; c.textBaseline = 'alphabetic'; c.textAlign = 'left'; }
  const widthOf = (c, font, size, s, tracking = 0) => { setText(c, font, size, tracking); return c.measureText(s).width; };
  // capRatio measures its first call by assigning ctx.font. Preserve drawing
  // state so a cold seek directly to the ending paints the same type size.
  const capOf = (font, size) => { g.save(); const cap=capRatio(g,font)*size; g.restore(); return cap; };
  // words wrapped at a width, greedily
  function wrapAt(c, words, font, size, width, tracking) {
    const parts=[];
    for (const word of words) {
      if (word.length < 20 || widthOf(c,font,size,word,tracking)<=width) { parts.push(word); continue; }
      let part='';
      for (const ch of [...word]) {
        if (part && widthOf(c,font,size,part+ch,tracking)>width) { parts.push(part); part=''; }
        part+=ch;
      }
      if(part) parts.push(part);
    }
    const lines=[]; let cur='';
    for(const word of parts) { const next=cur ? `${cur} ${word}` : word;
      if(cur && widthOf(c,font,size,next,tracking)>width) { lines.push(cur);cur=word; } else cur=next;
    }
    return cur ? [...lines,cur] : lines;
  }
  // the largest size (between min and max) at which the text wraps into maxLines within maxW,
  // then the narrowest measure that keeps that many lines, so the lines come out even
  function fitLines(c, text, font, { maxSize, minSize, maxW, maxLines, tracking = 0 }) {
    const words = String(text).trim().split(/\s+/).filter(Boolean);
    if (!words.length) return { size: maxSize, lines: [] };
    const fits = (s) => { const l = wrapAt(c, words, font, s, maxW, tracking); return l.length <= maxLines && l.every((x) => widthOf(c, font, s, x, tracking) <= maxW + 0.5) ? l : null; };
    let size = maxSize, lines = fits(maxSize);
    if (!lines) {
      let lo = minSize, hi = maxSize; lines = null;
      for (let i = 0; i < 16; i++) { const mid = (lo + hi) / 2, l = fits(mid); if (l) { size = mid; lines = l; lo = mid; } else hi = mid; }
      if (!lines) { size = minSize; lines = wrapAt(c, words, font, size, maxW, tracking); }
    }
    if (lines.length > 1) { // balance; and where a break can fall after a comma or full stop, take it
      let lo = maxW * 0.45, hi = maxW;
      for (let i = 0; i < 12; i++) { const mid = (lo + hi) / 2, l = wrapAt(c, words, font, size, mid, tracking); if (l.length <= lines.length && l.every((x) => widthOf(c, font, size, x, tracking) <= mid + 0.5)) { lines = l; hi = mid; } else lo = mid; }
      const stops = (l) => l.slice(0, -1).filter((x) => /[,.;:]$/.test(x)).length;
      for (let k = 0; k <= 24; k++) {
        const w = maxW * (1 - k * 0.022), l = wrapAt(c, words, font, size, w, tracking);
        if (l.length === lines.length && stops(l) > stops(lines) && l.every((x) => widthOf(c, font, size, x, tracking) <= maxW + 0.5)) lines = l;
      }
    }
    return { size, lines };
  }
  // one line whose words rise into place from behind a mask at the baseline, a word every `stagger`
  function rise(c, text, x, y, font, size, t, t0, { colour, align = 'left', tracking = 0, stagger = 0.08, dur = 0.4 } = {}) {
    const words = String(text).split(' ').filter(Boolean);
    const space = widthOf(c, font, size, ' ', tracking), widths = words.map((w) => widthOf(c, font, size, w, tracking));
    const total = widths.reduce((a, b) => a + b, 0) + space * Math.max(0, words.length - 1);
    let wx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
    words.forEach((w, i) => {
      const p = (t - t0 - i * stagger) / dur;
      if (p > 0) {
        const e = tall ? out5(p) : out3(p), dy = (1 - e) * size * 0.95;
        c.save(); c.globalAlpha *= e;
        if (e < 1) { c.beginPath(); c.rect(wx - size, y - size * 1.25, widths[i] + 2 * size, size * 1.55); c.clip(); }
        setText(c, font, size, tracking); c.fillStyle = colour; c.fillText(w, wx, y + dy);
        c.restore();
      }
      wx += widths[i] + space;
    });
    return total;
  }

  // ---------- KEEP: a feature's words: the version, the name, its line ----------
  // Measured first (so the product can take the rest of the frame), then drawn rising.
  function titleBlock(f, box, align) {
    const tag = V[f.words[0]] || '', name = V[f.words[1]] || '', line = V[f.words[2]] || '';
    const beside = align === 'left';
    const nameFont = DISPLAY(480), lineFont = SANS(500), tagFont = MONO(500);
    const N = fitLines(g, name, nameFont, { maxSize: box.nameMax, minSize: 2.4 * U, maxW: box.w, maxLines: /\S{20}/.test(name) ? 3 : 2, tracking: -0.035 });
    const ls = Math.min(box.lineSize, N.size / 1.4), L = fitLines(g, line, lineFont, { maxSize: ls, minSize: 2.2 * U, maxW: box.lineW || box.w, maxLines: 3, tracking: -0.01 });
    const tagS = 3.0 * U, nameLead = N.size * 1.0, lineLead = L.size * 1.28;
    const capN = capOf(nameFont, N.size), capL = capOf(lineFont, L.size), capT = capOf(tagFont, tagS);
    // vertical rhythm: tag, a gap, the name's lines, a gap, the line's lines
    let y = 0; const rows = [];
    if (tag) { y += capT; rows.push({ kind: 'tag', text: tag, y, size: tagS }); y += tagS * 1.1; }
    N.lines.forEach((l, i) => { y += i ? nameLead : capN; rows.push({ kind: 'name', text: l, y, size: N.size, i }); });
    y += N.size * 0.22;
    L.lines.forEach((l, i) => { y += i ? lineLead : capL + L.size * 0.62; rows.push({ kind: 'line', text: l, y, size: L.size, i }); });
    y += L.size * 0.3;
    return { rows, height: y, nameSize: N.size };
  }
  function drawTitle(f, block, x, top, align, t, colours, t0 = f.t0) {
    for (const r of block.rows) {
      // the name is already rising on the cut's first frame
      if (r.kind === 'tag') rise(g, r.text, x, top + r.y, MONO(500), r.size, t, t0, { colour: colours.tag, align, tracking: 0.02 });
      if (r.kind === 'name') rise(g, r.text, x, top + r.y, DISPLAY(480), r.size, t, t0 + r.i * 1.5 * F, { colour: colours.name, align, tracking: -0.035 });
      if (r.kind === 'line') rise(g, r.text, x, top + r.y, SANS(500), r.size, t, t0 + BEAT + r.i * F, { colour: colours.line, align, tracking: -0.01, stagger: 0.05, dur: 0.36 });
    }
  }

  // ---------- KEEP: the layouts. Beside (wide only) or above; the product's cards take the rest ----------
  // A feature shows one or more views of its product, each in its own card (tall stacks a control
  // over its result). A card is as wide as the room and as tall as its tallest framing needs at that
  // width, so the product fills it. When the cards don't fit, a single card gives way in height (the
  // camera fits its framings to what's left) and a stack shrinks whole.
  function cardsFor(views, area, gap) {
    const [ax, ay, aw, ah] = area;
    const sizes = views.map((v) => {
      let w = 0, h = 0;
      for (const key of v.keys) { const [, , fw, fh] = framing(key[1]), k = Math.min(aw / (fw * 1.08), v.maxK); w = Math.max(w, fw * 1.08 * k); h = Math.max(h, fh * 1.08 * k); }
      return [Math.min(aw, Math.max(w, aw * (v.fill ?? 1))), h];
    });
    const total = sizes.reduce((a, [, h]) => a + h, 0) + gap * (views.length - 1), s = Math.min(1, ah / total);
    let y = ay + (ah - Math.min(total, ah)) / 2;
    const sw = views.length > 1 ? s : 1; // a stack shrinks whole, so each framing still fills its card; a single card keeps its width
    return sizes.map(([w, h]) => { const r = [ax + (aw - w * sw) / 2, y, w * sw, h * s]; y += h * s + gap; return r; });
  }
  function layoutFor(f, t) {
    const views = f.views(t), gap = 2.4 * U;
    if (tall) {
      const block = titleBlock(f, { w: column(), nameMax: 10 * U, lineSize: 4.2 * U }, 'left');
      const ty = 0.10 * H, y0 = ty + block.height + gap, bottom = 0.88 * H;
      // One 7% column. Every crop has a fixed aspect and pixel scale; a
      // room-photo band supplies Light's context without shrinking its meter.
      const heights = views.map(v => column() / cropRatio(v.keys,t));
      const total = heights.reduce((a,b)=>a+b,0) + gap * (views.length-1);
      const available = Math.max(1,bottom-y0), scale = Math.min(1,available/total);
      let y = bottom-total*scale;
      const cards = heights.map(h => { const card=[margin(),y,column()*scale,h*scale]; y+=h*scale+gap*scale; return card; });
      return { views, block, tx: margin(), ty, align: 'left', cards };
    }
    return releaseLayout(f, views, gap);
  }
  // Rev 7: native panel aspects and a fixed camera scale in each frame.
  // Square keeps the meter's proof-reading size; its room band joins the same card.
  function releaseLayout(f, views, gap) {
    const titleWidth=wide ? W*0.33 : column()-3*U;
    let nameMax=(wide?11.5:8.8)*U,lineSize=(wide?4.4:3.7)*U,block;
    const titleHeight=(wide?.34:.145)*H;
    for(let i=0;i<30;i++) {
      block=titleBlock(f,{w:titleWidth,nameMax,lineSize},'left');
      if(block.height<=titleHeight)break;
      nameMax*=.94;lineSize*=.94;
    }
    const ty=.10*H,bottom=.90*H;
    let cards;
    if(wide) {
      const area=[.46*W,ty,.47*W,bottom-ty];
      const panel=views.at(-1),r=framing(panel.keys[0][1]),ratio=r[2]/r[3];
      const h=Math.min(area[3],area[2]/ratio),w=h*ratio;
      const primary=[area[0]+area[2]-w,ty,w,h];
      cards=[primary];
      if(f===F1) {
        const pr=framing(views[0].keys[0][1]),pw=titleWidth;
        const photo=[margin(),bottom-pw*pr[3]/pr[2],pw,pw*pr[3]/pr[2]];
        cards=[photo,primary];
      }
    } else {
      const top=ty+block.height+gap,available=bottom-top;
      if(f===F1) {
        const photoWidth=.28*W,meterWidth=.54*W;
        const heights=views.map((v,i)=>{
          const r=framing(v.keys[0][1]);return (i?meterWidth:photoWidth)*r[3]/r[2];
        });
        const scale=Math.min(1,available/(heights[0]+heights[1]+gap));
        let y=bottom-(heights[0]+heights[1]+gap)*scale;
        cards=heights.map((h,i)=>{
          const w=(i?meterWidth:photoWidth)*scale,card=[(W-w)/2,y,w,h*scale];
          y+=h*scale+gap*scale;return card;
        });
        // Rev 7b: use the space above the unchanged meter for a full-width
        // photo band. Crop the room vertically, never shrink the proof UI.
        const meter=cards[1];
        cards[0]=[meter[0],top,meter[2],meter[1]-top];
      } else {
        const r=framing(views[0].keys[0][1]),ratio=r[2]/r[3];
        const maxWidth=f===F2?.65*W:column(),h=Math.min(available,maxWidth/ratio),w=h*ratio;
        cards=[[f===F2?W-margin()-w:(W-w)/2,bottom-h,w,h]];
      }
    }
    return {views,block,tx:margin(),ty,align:'left',cards};
  }

  // ---------- KEEP: the product card, the camera inside it, the cursor ----------
  // A camera key is [t, framing, ease, dip]: a framing is a page rect (CSS px), or one per shape
  // ({ '16:9': rect, '1:1': rect, '9:16': rect }), fitted to the card with a margin and never past
  // the capture's scale × 1.15. Moves: cut, whip (back-loaded, lands soft), pull (front-loaded),
  // move (in and out), drift (the camera breathing during a hold). Scale moves in log space.
  const EASE = {
    cut: () => 1,
    pull: (p) => 1 - (1 - p) ** 3.5,
    whip: (p) => { const q = p ** 1.35; return q < 0.5 ? 4 * q ** 3 : 1 - (-2 * q + 2) ** 3 / 2; },
    move: (p) => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2),
    drift: (p) => p,
  };
  const framing = (fr) => (Array.isArray(fr) ? fr : fr[shape] || fr['16:9']);
  function fitCam(rect, card, maxK, bounds, zoom = 1) {
    const [x, y, w, h] = rect, [, , cw, ch] = card;
    const k = Math.min(cw / (w * 1.08), ch / (h * 1.08), maxK) * zoom;
    let cx = x + w / 2, cy = y + h / 2;
    if (bounds) { // keep the view inside the capture
      const hw = cw / 2 / k, hh = ch / 2 / k, [bx, by, bw, bh] = bounds;
      cx = bw > 2 * hw ? clamp(cx, bx + hw, bx + bw - hw) : bx + bw / 2;
      cy = bh > 2 * hh ? clamp(cy, by + hh, by + bh - hh) : by + bh / 2;
    }
    return { x: cx, y: cy, k };
  }
  function camOn(keys, t, card, maxK, bounds) {
    const fit = (key) => fitCam(framing(key[1]), card, maxK, typeof bounds === 'function' ? bounds(key[0]) : bounds, key[4] || 1);
    let a = keys[0], b = keys[0];
    for (let i = 1; i < keys.length; i++) { if (t < keys[i][0]) { b = keys[i]; break; } a = b = keys[i]; }
    const A0 = fit(a), B0 = fit(b);
    const q = b === a ? 1 : clamp((t - a[0]) / (b[0] - a[0])), p = b === a ? 1 : EASE[b[2]](q);
    const dip = b[3] ? 1 - b[3] * Math.sin(Math.PI * q) ** 2 : 1;
    return { x: lerp(A0.x, B0.x, p), y: lerp(A0.y, B0.y, p), k: Math.exp(lerp(Math.log(A0.k), Math.log(B0.k), p)) * dip };
  }
  function cardIn(t, t0, top) { // the card rises in from below the frame on a spring, a step after the name
    const s = m.settle(t - t0, 0.6);
    return { dy: (1 - s) * (H - top + 4 * U), k: lerp(0.96, 1, clamp(s, 0, 1.2)), on: t >= t0 };
  }
  function drawCard(card, ground, t, t0, paint) {
    const [x, y, w, h] = card, r = 1.4 * U, m = cardIn(t, t0, y);
    if (!m.on) return;
    g.save();
    g.translate(x + w / 2, y + h / 2 + m.dy); g.scale(m.k, m.k); g.translate(-w / 2, -h / 2);
    g.save(); // shadow, then the border
    roundRect(g, 0, 0, w, h, r);
    g.shadowColor = ground === 'light' ? 'rgba(14,18,32,0.30)' : 'rgba(0,0,0,0.65)'; g.shadowBlur = 5 * U; g.shadowOffsetY = 1.8 * U;
    g.fillStyle = UI_INK; g.fill(); g.restore();
    g.save(); roundRect(g, 0, 0, w, h, r); g.clip();
    paint(w, h);
    g.restore();
    roundRect(g, 0.5, 0.5, w - 1, h - 1, r); g.lineWidth = Math.max(1, 0.12 * U); g.strokeStyle = ground === 'light' ? 'rgba(14,18,32,0.22)' : UI_LINE; g.stroke();
    g.restore();
  }
  // a capture through the camera, inside a card of size w × h
  const toCard = (cam, w, h, x, y) => [(x - cam.x) * cam.k + w / 2, (y - cam.y) * cam.k + h / 2];
  function drawCap(cam, w, h, name, set) {
    const { img, rect: [x, y, cw, ch] } = cap(name, set), [fx, fy] = toCard(cam, w, h, x, y);
    g.imageSmoothingQuality = 'high'; g.drawImage(img, fx, fy, cw * cam.k, ch * cam.k);
  }
  // a point on a page rect: [x + w·fx, y + h·fy]
  const on = (r, fx = 0.6, fy = 0.62) => [r[0] + r[2] * fx, r[1] + r[3] * fy];

  // ---------- ADAPT: real app states and touches ----------
  // One soft contact ring; the app supplies all controls, text, photos and results.
  function touch(t, when, target, cam, w, h) {
    const age = t - when;
    if (age < -0.1 || age > 0.42) return;
    const [x,y] = toCard(cam,w,h,...target), p = clamp((age + 0.1) / 0.52);
    g.save(); g.globalAlpha = Math.sin(Math.PI * p) * 0.75;
    g.beginPath(); g.arc(x,y,(2.2 + p * 1.8) * U,0,2*Math.PI);
    g.fillStyle = '#ffffff'; g.fill(); g.lineWidth = 0.22 * U; g.strokeStyle = '#28452A'; g.stroke(); g.restore();
  }
  const F1 = { t0: at(1,1), words: ['tag1','name1','line1'], ground: 'light', layout: 'beside', click: at(1,2) };
  F1.views = (t) => lightViews(t);

  const F2 = { t0: at(2,3), words: ['tag2','name2','line2'], ground: 'dark', layout: 'beside', click: at(2,3.5), second: at(3,0.5), remind: at(3,1.75) };
  F2.views = (t) => rescueViews(t);

  const F3 = { t0: at(4,1), words: ['tag3','name3','line3'], ground: 'light', layout: 'beside', click1: at(4,2), click2: at(5,1), click3: at(6) };
  F3.views = (t) => waterViews(t);

  const FEATURES = [F1, F2, F3];

  // ---------- KEEP: the beats. ADAPT their times when the features change ----------
  const BEATS = { open: 0, stat: at(7,2), end: at(8,3), duration: at(10) };

  function hoverUI(t,f,index,cam,w,h) {

  // Press the existing captured control on the hit frame, for the exact same

  // ---------- ADAPT: Keeper, the cast's current mark, on its cream tile ----------

  // ---- the stat (bars 7–8.5): one number counts up; two lines say what it proves ----
  function parseStat(s) { // "3,534" → { pre, value, dec, commas, post }; anything else counts as text
    const m = String(s).match(/^([^\d]*)(\d[\d,]*(?:\.\d+)?)(.*)$/);

  // One count, claim and set of the three photographed plants. In wide,

  const ACTS = [[BEATS.open, open], ...FEATURES.map((f) => [f.t0, (t) => feature(t, f)]), [BEATS.stat, stat], [BEATS.end, end]];

  // ---------- KEEP: drawing, loading; ADAPT: the cues and the score ----------

    g.reset();

  async function prepare() {

  // sound: the kit on the cues (scripts/sounds/kit.json)

    // mark the shared push onset; result tones mark the native region's
    // first move, and soft pops follow the staggered photographs. Preserve
    // the approved portrait soundtrack below byte-for-byte.
    if(!portrait) {

      HANDOFFS.forEach(([time])=>add(time-HANDOFF/2,'swish',.35,{kind:'container',travel:1}));

    shutters: [F1.click,F2.click,F2.second,F2.remind,F3.click1,F3.click2,F3.click3].map(t=>[t,t+RELEASE+RESULT,0]),

    // Stress samples cover settled layouts and complete transition endpoints.

    keyTimes: [0,0.13,0.35,0.7,0.95,1.2,1.8,19.95,
      ...[F1.t0,F2.t0,F3.t0,BEATS.stat,BEATS.end].flatMap(t=>[-.26,.26].map(dt=>t+dt)),

      ...[F3.click1,F3.click2,F3.click3].flatMap(t=>[-.1,0,.08,.25,.5,.75,1.06,1.25,1.49].map(dt=>t+dt)),
      BEATS.stat+.6,BEATS.stat+1.1,BEATS.stat+1.75,BEATS.end+.4,BEATS.end+.6,BEATS.end+1.1],
  };
  const q = new URLSearchParams(location.search);

  if (window.parent === window && !q.has('render')) prepare().then(() => { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION, { size: q.get('size') || '9:16' }); requestAnimationFrame(loop); }; loop(); });
