<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamplit · What's new · Fictional company example</title>
<style>
  html, body { margin: 0; height: 100%; background: #080b14; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="kit.js"></script>
<script>
// Lamplit release clip, rev 8: one choreography and one timeline in every shape; only the layout changes.
// KEEP: kit.motion reveals/cursors, edge wipes, fixed capture crops attached to whole cards,
//       measured type, dark-first ground and the release/feature/stat/update grammar.
// ADAPT: named words, palette, drawMark's image, real captures and sourced release claims.
// REPLACE: the demonstrated product actions with actions from the user's own working app.
(() => {
  const { clamp, lerp, loadFont, loadImage, roundRect, capRatio, motion: M } = window.kit;
  const FPS = 60;
  let BPM = 120, BEAT = 60 / BPM;
  const SHAPES = { '16:9': [1920, 1080], '1:1': [1440, 1440], '9:16': [1080, 1920] };
  let W = 1080, H = 1920, U = 10.8, shape = '9:16', tall = true, wide = false; // U: 1% of the short side

  const canvas = document.getElementById('c');
  // a helper canvas, CPU-backed like the film's own (AGENTS.md)
  function g2d(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c.getContext('2d', { willReadFrequently: true }); }
  const g = canvas.getContext('2d', { willReadFrequently: true });

  // ---------- ADAPT: the product's colours (cast/lamplit/brand.md) ----------
  // Dark first: the film sits in Lamplit's own night, one shade under the dashboard's ink, so the
  // product windows read as lit screens. Amber is the one light: the lamp, running things, the stat.
  const NIGHT = '#080B14', INK = '#0E1220', LINE = '#2A3150', TEXT = '#ECEAE3', MUTED = '#8D93A8', AMBER = '#FFB23F';
  const AMBER_RGB = '255,178,63';
  const SANS = (w) => (s) => `${w} ${s}px "Instrument Sans"`;
  const MONO = (w) => (s) => `${w} ${s}px "JetBrains Mono"`;

  // ---------- ADAPT: the words, as named fields ----------
  const DEFAULTS = {
    category: 'Background jobs for developers.', open: "What's new, 3.2 to 3.4",
    tag1: 'v3.4', name1: 'Schedules in plain English.', line1: 'Type when a job runs. Lamplit writes the cron.',
    tag2: 'v3.3', name2: 'Replay from any step.', line2: 'A failed run picks up at the step that failed.',
    tag3: 'v3.2', name3: 'Fan-out.', line3: '412 images, one step, one row.',
    statPre: 'Up to', stat: '10,000', stat1: 'child runs from one step.', stat2: 'All of them on one row.', statSource: 'Sample releases · v3.2',
    promise: 'Every job, in the light.', get: 'npm i lamplit@latest',
  };
  const FIELDS = [
    { id: 'category', type: 'text', label: 'Product category', maxLength: 40 },
    { id: 'open', type: 'text', label: 'Open line', maxLength: 32, help: 'What this is; a version in it is lit amber.' },
    { id: 'tag1', type: 'text', label: 'Feature 1, version', maxLength: 8, help: 'Leave a version empty to hide it.' },
    { id: 'name1', type: 'text', label: 'Feature 1, name', maxLength: 32, help: 'One to five words, with a full stop.' },
    { id: 'line1', type: 'text', label: 'Feature 1, line', maxLength: 56 },
    { id: 'tag2', type: 'text', label: 'Feature 2, version', maxLength: 8 },
    { id: 'name2', type: 'text', label: 'Feature 2, name', maxLength: 32 },
    { id: 'line2', type: 'text', label: 'Feature 2, line', maxLength: 56 },
    { id: 'tag3', type: 'text', label: 'Feature 3, version', maxLength: 8 },
    { id: 'name3', type: 'text', label: 'Feature 3, name', maxLength: 32 },
    { id: 'line3', type: 'text', label: 'Feature 3, line', maxLength: 56 },
    { id: 'statPre', type: 'text', label: 'Stat, over the number', maxLength: 24, help: 'A qualifier the source states, e.g. "Up to".' },
    { id: 'stat', type: 'text', label: 'Stat', maxLength: 8, help: 'A number from the product; it counts up from 0.' },
    { id: 'stat1', type: 'text', label: 'Stat, line 1', maxLength: 44 },
    { id: 'stat2', type: 'text', label: 'Stat, line 2', maxLength: 44 },
    { id: 'statSource', type: 'text', label: 'Stat source', maxLength: 40 },
    { id: 'promise', type: 'text', label: 'Promise', maxLength: 40 },
    { id: 'get', type: 'text', label: 'How to get it', maxLength: 32 },
  ];
  let V = DEFAULTS;

  // House easing: entrances out/settle, scene pushes settle, camera travel inOut. No custom motion curves.
  const ease = (name, p) => name === 'expo' ? M.snap(p) : M.out(p);
  const crit = (t) => M.settle(t, 0.5);

  // ---------- KEEP: assets ----------
  const SETS = ['screens', 'screens-narrow', 'details', 'fanout-pressed', 'controls'];
  const A = { sets: {}, img: {}, brand: {} };
  const cap = (name, set) => { const c = A.sets[set].captures[name]; return { img: A.img[`${set}/${c.file}`], rect: c.rect, scale: c.scale }; };
  const R = (state, set) => A.sets[set].rects[state];

  // ---------- KEEP: type. Words rise from behind a mask at their baseline ----------
  function setText(c, font, size, tracking = 0) { c.font = font(size); c.letterSpacing = `${tracking * size}px`; c.textBaseline = 'alphabetic'; c.textAlign = 'left'; }
  const widthOf = (c, font, size, s, tracking = 0) => { setText(c, font, size, tracking); return c.measureText(s).width; };
  // capRatio sets the font on a cache miss; preserve the caller's drawing state.
  const capOf = (font, size) => { g.save(); const cap = capRatio(g, font) * size; g.restore(); return cap; };
  function wrapAt(c, words, font, size, width, tracking) {
    const parts = [];
    for (const word of words) {
      if (word.length < 20 || widthOf(c, font, size, word, tracking) <= width) { parts.push(word); continue; }
      let part = '';
      for (const ch of [...word]) { if (part && widthOf(c, font, size, part + ch, tracking) > width) { parts.push(part); part = ''; } part += ch; }
      if (part) parts.push(part);
    }
    const lines = []; let cur = '';
    for (const word of parts) { const next = cur ? `${cur} ${word}` : word; if (cur && widthOf(c, font, size, next, tracking) > width) { lines.push(cur); cur = word; } else cur = next; }
    return cur ? [...lines, cur] : lines;
  }
  // the largest size at which the text wraps into maxLines within maxW, then balanced lines
  function fitLines(c, text, font, { maxSize, minSize, maxW, maxLines, tracking = 0 }) {
    const words = String(text).trim().split(/\s+/).filter(Boolean);
    if (!words.length) return { size: maxSize, lines: [] };
    const fits = (s) => { const l = wrapAt(c, words, font, s, maxW, tracking); return l.length <= maxLines && l.every((x) => widthOf(c, font, s, x, tracking) <= maxW + 0.5) ? l : null; };
    let size = maxSize, lines = fits(maxSize);
    if (!lines) {
      let lo = minSize, hi = maxSize;
      for (let i = 0; i < 16; i++) { const mid = (lo + hi) / 2, l = fits(mid); if (l) { size = mid; lines = l; lo = mid; } else hi = mid; }
      if (!lines) { size = minSize; lines = wrapAt(c, words, font, size, maxW, tracking); }
    }
    if (lines.length > 1) {
      let lo = maxW * 0.45, hi = maxW;
      for (let i = 0; i < 12; i++) { const mid = (lo + hi) / 2, l = wrapAt(c, words, font, size, mid, tracking); if (l.length <= lines.length && l.every((x) => widthOf(c, font, size, x, tracking) <= mid + 0.5)) { lines = l; hi = mid; } else lo = mid; }
      const stops = (l) => l.slice(0, -1).filter((x) => /[,.;:]$/.test(x)).length;
      for (let k = 0; k <= 24; k++) {
        const w = maxW * (1 - k * 0.022), l = wrapAt(c, words, font, size, w, tracking);
        if (l.length === lines.length && stops(l) > stops(lines) && l.every((x) => widthOf(c, font, size, x, tracking) <= maxW + 0.5)) lines = l;
      }
    }
    return { size, lines };
  }
  // one line whose words rise into place from behind a mask at the baseline, a word every `stagger`
  function rise(c, text, x, y, font, size, t, t0, { colour, align = 'left', tracking = 0, stagger = 0.07, dur = 0.5, accent } = {}) {
    const words = String(text).split(' ').filter(Boolean);
    const space = widthOf(c, font, size, ' ', tracking), widths = words.map((w) => widthOf(c, font, size, w, tracking));
    const total = widths.reduce((a, b) => a + b, 0) + space * Math.max(0, words.length - 1);
    let wx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
    words.forEach((w, i) => {
      const p = (t - t0 - i * stagger) / dur;
      if (p > 0) {
        const e = ease('quint', p), dy = (1 - e) * size * 1.05;
        c.save();
        if (e < 1) { c.beginPath(); c.rect(wx - size, y - size * 1.3, widths[i] + 2 * size, size * 1.62); c.clip(); }
        c.globalAlpha *= e;
        setText(c, font, size, tracking); c.fillStyle = accent && accent(w, i) ? accent(w, i) : colour; c.fillText(w, wx, y + dy);
        c.restore();
      }
      wx += widths[i] + space;
    });
    return total;
  }

  // ---------- KEEP: a feature's words: the version, the name, its line ----------
  function titleBlock(f, box) {
    const tag = V[f.words[0]] || '', name = V[f.words[1]] || '', line = V[f.words[2]] || '';
    const nameFont = SANS(600), lineFont = SANS(500), tagFont = MONO(500);
    const N = fitLines(g, name, nameFont, { maxSize: box.nameMax, minSize: 2.6 * U, maxW: box.w, maxLines: /\S{20}/.test(name) ? 3 : 2, tracking: -0.035 });
    const ls = Math.min(box.lineSize, N.size / 1.6), L = fitLines(g, line, lineFont, { maxSize: ls, minSize: 2.4 * U, maxW: box.w, maxLines: 3, tracking: -0.01 });
    const tagS = 3.4 * U, capN = capOf(nameFont, N.size), capL = capOf(lineFont, L.size), capT = capOf(tagFont, tagS);
    let y = 0; const rows = [];
    if (tag) { y += capT; rows.push({ kind: 'tag', text: tag, y, size: tagS }); y += tagS * 1.25; }
    N.lines.forEach((l, i) => { y += i ? N.size * 1.0 : capN; rows.push({ kind: 'name', text: l, y, size: N.size, i }); });
    y += N.size * 0.24;
    L.lines.forEach((l, i) => { y += i ? L.size * 1.3 : capL + L.size * 0.7; rows.push({ kind: 'line', text: l, y, size: L.size, i }); });
    y += L.size * 0.32;
    return { rows, height: y };
  }
  function drawTitle(f, block, x, top, t) {
    const at = f.t0 - LEAD;
    for (const r of block.rows) {
      if (r.kind === 'tag') {
        // the version: an amber dot that lights, then the number rises beside it
        const d = r.size * 0.36, cx = x + d / 2, cy = top + r.y - capOf(MONO(500), r.size) / 2, k = crit(t - at);
        if (k > 0) { glowDot(cx, cy, d / 2 * k, 1); }
        rise(g, r.text, x + d + r.size * 0.55, top + r.y, MONO(500), r.size, t, at, { colour: AMBER, tracking: 0.02 });
      }
      if (r.kind === 'name') rise(g, r.text, x, top + r.y, SANS(600), r.size, t, at + 0.08 + r.i * 0.1, { colour: TEXT, tracking: -0.035 });
      if (r.kind === 'line') rise(g, r.text, x, top + r.y, SANS(500), r.size, t, at + BEAT * 0.75 + r.i * 0.08, { colour: MUTED, tracking: -0.01, stagger: 0.045, dur: 0.45 });
    }
  }
  function glowDot(cx, cy, r, a) {
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r * 4);
    gr.addColorStop(0, `rgba(${AMBER_RGB},${0.35 * a})`); gr.addColorStop(1, `rgba(${AMBER_RGB},0)`);
    g.fillStyle = gr; g.fillRect(cx - r * 4, cy - r * 4, r * 8, r * 8);
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fillStyle = AMBER; g.fill();
  }

  // ---------- KEEP: the frame. Words on top (or left in wide); the product's windows take the rest ----------
  function layoutFor(f) {
    const side = 0.07 * W;
    if (wide) {
      const w = 0.33 * W, block = titleBlock(f, { w, nameMax: 13 * U, lineSize: 4.4 * U });
      return { block, tx: 0.07 * W, ty: H / 2 - block.height / 2, area: [0.44 * W, 0.07 * H, 0.52 * W, 0.86 * H] };
    }
    // Square: a compact title (one line where it fits) so the product cards get most of the frame.
    const block = titleBlock(f, { w: W - 2 * side, nameMax: (tall ? 10 : 6.4) * U, lineSize: (tall ? 4.6 : 3.6) * U });
    const ty = (tall ? 0.10 : 0.05) * H, top = ty + block.height + (tall ? 4 : 3) * U, bottom = tall ? H * 0.88 : H - 7 * U, x = side; // square: the same 7% margin as the sides
    return { block, tx: side, ty, area: [x, top, W - 2 * x, Math.max(20 * U, bottom - top)] };
  }

  // ---------- KEEP: fixed captured pixels; move the complete card ----------
  // A crop is fixed for the life of a card. Only the card's outer transform moves.
  // Source pixel scale never changes independently of the border/background/cursor target.
  // Pauses only where the viewer needs them (the founder, 2026-10-21; style.md, "Pauses"): a feature's name and line
  // land before the cursor sets off (a second more in Schedules, half a second in Replay, whose 14 words arrive with a
  // scene push), the cursor hovers about half a second before every press, and the stat's lines get half a second more to read.
  // The product's own working (typing, the cron, the replay's states, the popover) keeps its pace.
  const TIMING = { open: 0, f1: 3.2, f2: 9.5, f3: 15.7, stat: 20.1, wipe: 24.2, end: 24.8, duration: 27.9 }; // the end card holds while the score's last hit rings out
  // the cursor's path ends this long before its press; its ease-out has it on the target about half a second before
  // the press (a natural hover, then the click)
  const HOVER = 0.15;
  let T, F1, F2, F3, FEATURES, DURATION;
  function timeline() {
    T=TIMING; BPM=120; BEAT=60/BPM; DURATION=T.duration;
    F1={t0:T.f1,words:['tag1','name1','line1'],click:5.1,typeA:5.5,typeB:6.8};
    F1.letters=t=>t<F1.typeA?0:t<F1.typeB?Math.min(13,Math.floor((t-F1.typeA)/0.09)+1):Math.min(20,14+Math.floor((t-F1.typeB)/0.085));
    F2={t0:T.f2,words:['tag2','name2','line2'],click:11.3,queued:11.42,running:12.9,done:14.15,travel:11.85};
    F3={t0:T.f3,words:['tag3','name3','line3'],click1:17.3,pop:17.42,flood:19.5};
    FEATURES=[F1,F2,F3];
  }
  timeline();
  const HANDOFF = 0.60, LEAD = 0.50;
  const cardAt = (f, stagger = 0) => f.t0 - LEAD + stagger;
  const crop = (id, set, shot, source, extra = {}) => ({ id, set, shot, source, ...extra });

  function stack(area, cards) {
    const [x,y,w,h] = area, gapMin = 2.6*U;
    const widths = cards.map(c => Math.min(w, c.source[2] * (c.maxK || 3.45)));
    const heights = cards.map((c,i) => widths[i] * c.source[3]/c.source[2]);
    const sum = heights.reduce((a,b)=>a+b,0), k = Math.min(1,(h-gapMin*(cards.length-1))/sum);
    const gap = cards.length > 1 ? (h-sum*k)/(cards.length-1) : 0;
    let yy = cards.length === 1 ? y+(h-sum*k)/2 : y;
    return cards.map((c,i) => { const cw=widths[i]*k, ch=heights[i]*k;
      const out={...c,rect:[x+(w-cw)/2,yy,cw,ch]}; yy+=ch+gap; return out;
    });
  }
  // The widest column of cards (height/width ratios joined by gaps) that fits the area:
  // centred across it, top-aligned (centred vertically in wide, beside the words).
  function column(area,ratios,gap) {
    const [x,y,w,h]=area,sum=ratios.reduce((a,b)=>a+b,0),cw=Math.min(w,(h-gap*(ratios.length-1))/sum);
    return { x:x+(w-cw)/2, y:wide?y+(h-cw*sum-gap*(ratios.length-1))/2:y, w:cw };
  }
  function cardPose(c,t) {
    const [x,y,w,h]=c.rect, enter=M.settle(t-c.at,c.enterDur||0.55), grow=lerp(c.from??0.95,1,enter);
    // One camera push per complete card, bounded inside the 7% safe margins.
    const until=c.at<T.f2-LEAD?T.f2:c.at<T.f3-LEAD?T.f3:T.stat;
    const push=M.inOut((t-c.at-0.7)/(until-c.at-0.7));
    let scale=grow*lerp(0.985,1,push);
    let cx=x+w/2, cy=y+h/2+(1-enter)*(c.rise??0.085)*H;
    // A popover grows out of the control that opened it, not out of its own centre.
    if(c.anchor){cx=c.anchor[0]+(cx-c.anchor[0])*grow;cy=c.anchor[1]+(cy-c.anchor[1])*grow;}
    let a=M.out((t-c.at)/(c.fadeIn||0.12));
    // A control that has done its job lifts a little and fades where it stands.
    if(c.exitAt!==undefined){const e=M.inOut((t-c.exitAt)/0.25);a*=1-e;cy-=e*0.015*H;scale*=lerp(1,0.97,e);}
    return { cx,cy,w:w*scale,h:h*scale,scale,a };
  }
  function cardPoint(c,t,p) {
    const m=cardPose(c,t), [sx,sy,sw,sh]=c.source;
    return { x:m.cx-m.w/2+(p[0]-sx)*m.w/sw, y:m.cy-m.h/2+(p[1]-sy)*m.h/sh };
  }
  function paintCard(c,t) {
    const m=cardPose(c,t); if(m.a<=0) return;
    const [sx,sy,sw,sh]=c.source;
    g.save();g.globalAlpha=m.a;g.translate(m.cx,m.cy);g.scale(m.scale,m.scale);
    const [,,w,h]=c.rect,r=c.radius ? c.radius*w/sw : Math.min(2.6*U,h/4);
    g.save();roundRect(g,-w/2,-h/2,w,h,r);g.fillStyle=INK;g.shadowColor='rgba(0,0,0,0.5)';g.shadowBlur=5*U;g.shadowOffsetY=2*U;g.fill();g.restore();
    g.save();roundRect(g,-w/2,-h/2,w,h,r);g.clip();g.imageSmoothingQuality='high';
    const pixels=(shot,source=c.source)=>{
      const a=cap(shot,c.set),[px,py,pw,ph]=source,k=a.scale;
      g.drawImage(a.img,(px-a.rect[0])*k,(py-a.rect[1])*k,pw*k,ph*k,-w/2,-h/2,w,h);
    };
    // A card's changes happen inside its own elements (nativePixels); no drawn replacement UI.
    if(c.native) nativePixels(c,t,w,h); else pixels(c.shot);
    g.restore();roundRect(g,-w/2+0.75,-h/2+0.75,w-1.5,h-1.5,r);g.lineWidth=1.5;g.strokeStyle='rgba(236,234,227,0.11)';g.stroke();g.restore();
  }
  // Native pixels only. Every event owns an element-sized viewport; the
  // heading, border, neighbouring labels and row rules remain the base capture.
  function nativePixels(c,t,w,h) {
    const [sx,sy,sw,sh]=c.source,kx=w/sw,ky=h/sh;
    const draw=(shot,source,rect,dy=0,set=c.set)=>{
      const a=cap(shot,set),[x,y,rw,rh]=rect,[ox,oy]=source;
      g.drawImage(a.img,(ox+x-a.rect[0])*a.scale,(oy+y-a.rect[1])*a.scale,rw*a.scale,rh*a.scale,
        -w/2+x*kx,-h/2+(y+dy)*ky,rw*kx,rh*ky);
    };
    draw(c.native.base,c.native.source||c.source,[0,0,sw,sh]);
    for(const e of c.native.events) {
      if(t<=e.at)continue;
      const p=M.out((t-e.at)/(e.dur||0.35)),[x,y,rw,rh]=e.rect;
      g.save();g.beginPath();g.rect(-w/2+x*kx,-h/2+y*ky,rw*kx,rh*ky);g.clip();
      if(e.kind==='roll'&&p<1) {
        draw(e.before,e.beforeSource||c.source,e.rect,-p*rh);
        draw(e.shot,e.source||c.source,e.rect,(1-p)*rh,e.set||c.set);
      } else if(e.kind==='radial'&&p<1) {
        const [cx,cy]=e.center||[x+rw/2,y+rh/2];
        g.beginPath();g.arc(-w/2+cx*kx,-h/2+cy*ky,Math.hypot(rw*kx,rh*ky)/2*p,0,Math.PI*2);g.clip();
        draw(e.shot,e.source||c.source,e.rect,0,e.set||c.set);
      } else if(e.kind==='focus'&&p<1) {
        g.globalAlpha*=p;draw(e.shot,e.source||c.source,e.rect,0,e.set||c.set);
      } else if(p<1) {
        g.beginPath();g.rect(-w/2+x*kx,-h/2+y*ky,rw*kx,rh*ky*p);g.clip();draw(e.shot,e.source||c.source,e.rect,0,e.set||c.set);
      } else draw(e.shot,e.source||c.source,e.rect,0,e.set||c.set);
      g.restore();
    }
  }
  function scheduleCards(area,t) {
    const understood=F1.typeA+12*0.09,final=F1.typeB+6*0.085;
    const sourceNext=[694,317,352,222],blankNext=sourceNext; // ends in the panel's own padding below row 5
    const fieldEvents=[{at:F1.click,shot:'sched-00',rect:[11,9,424.55,50],kind:'focus',dur:.12}];
    for(let i=1;i<=20;i++)fieldEvents.push({at:i<=13?F1.typeA+(i-1)*.09:F1.typeB+(i-14)*.085,
      shot:`sched-${String(i).padStart(2,'0')}`,rect:[51,13,278,42],dur:1/FPS});
    // the badge's patch takes in its tick (from x 330), not just the word
    fieldEvents.push({at:understood,shot:'sched-13',rect:[326,18,109,28],dur:.30});
    const cronEvents=Array.from({length:5},(_,i)=>({at:understood+.04*i,shot:'sched-13',before:'sched-12',rect:[12.55+50*i,11,i===4?48.7:44,40],kind:'roll',dur:.35}));
    // the copy button's patch takes in the whole icon (x 324-336, y 26-38)
    cronEvents.push({at:understood+.2,shot:'sched-13',rect:[318,18,45,28],dur:.25},
      {at:final,shot:'sched-20',before:'sched-13',rect:[62.55,11,44,40],kind:'roll',dur:.40});
    const nextEvents=[];
    for(let i=0;i<5;i++) {
      const rect=[42,31+34*i,301,32];
      nextEvents.push({at:understood+.06*i,shot:'sched-13',before:'sched-12',beforeSource:blankNext,rect,kind:'roll',dur:.35});
